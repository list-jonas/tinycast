<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0620"/>
      <stop offset="0.5" stop-color="#140a3a"/>
      <stop offset="1" stop-color="#03142c"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a0f7a"/>
      <stop offset="0.35" stop-color="#7a2cff"/>
      <stop offset="0.6" stop-color="#b65cff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#0a3a8f"/>
      <stop offset="0.45" stop-color="#2f8cff"/>
      <stop offset="0.75" stop-color="#47d1ff"/>
      <stop offset="1" stop-color="#a6f0ff"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4b14c9"/>
      <stop offset="0.5" stop-color="#863bff"/>
      <stop offset="1" stop-color="#2b6dff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.06 0"/></filter>
  </defs>
  <rect width="2400" height="1500" fill="url(#base)"/>
  <ellipse cx="1900" cy="200" rx="900" ry="500" fill="#3a1aa8" opacity="0.55" filter="url(#softer)"/>
  <ellipse cx="300" cy="1350" rx="900" ry="420" fill="#0b4fb8" opacity="0.5" filter="url(#softer)"/>

  <!-- back ribbon -->
  <path d="M-200 1050 C 300 760, 760 1180, 1260 880 S 2100 360, 2650 520 L 2650 820 C 2150 700, 1700 1180, 1200 1220 S 300 1100, -200 1350 Z" fill="url(#r2)" opacity="0.9" filter="url(#soft)"/>
  <!-- main ribbon -->
  <path d="M-200 700 C 350 360, 820 920, 1300 640 S 2150 120, 2650 260 L 2650 560 C 2150 420, 1750 980, 1250 1010 S 380 700, -200 1000 Z" fill="url(#r1)" filter="url(#soft)"/>
  <!-- front ribbon -->
  <path d="M-200 460 C 420 180, 900 640, 1400 420 S 2200 -40, 2650 60 L 2650 210 C 2200 140, 1800 640, 1350 640 S 420 380, -200 620 Z" fill="url(#r3)" opacity="0.85" filter="url(#soft)"/>

  <!-- highlights along ribbon crests -->
  <path d="M-200 700 C 350 360, 820 920, 1300 640 S 2150 120, 2650 260" fill="none" stroke="url(#sheen)" stroke-width="26" opacity="0.55" filter="url(#edge)"/>
  <path d="M-200 1050 C 300 760, 760 1180, 1260 880 S 2100 360, 2650 520" fill="none" stroke="#bff3ff" stroke-width="18" opacity="0.35" filter="url(#edge)"/>
  <path d="M-200 460 C 420 180, 900 640, 1400 420 S 2200 -40, 2650 60" fill="none" stroke="#e9d9ff" stroke-width="14" opacity="0.35" filter="url(#edge)"/>

  <rect width="2400" height="1500" filter="url(#grain)"/>
</svg>
